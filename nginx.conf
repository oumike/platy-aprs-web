server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The image is built for the /platy/ subpath. platy.sumat.org proxies the
    # whole host here, so / answers with the SPA (whose asset URLs already say
    # /platy/) and /platy/... is rewritten back to root where the files live.
    location = /platy {
        return 301 /platy/;
    }
    location ^~ /platy/ {
        rewrite ^/platy/(.*)$ /$1 last;
    }

    # gzip static assets
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       application/wasm image/svg+xml;
    gzip_min_length    1024;

    # Resolver for proxy_pass to upstream hosts
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    # Long-cache hashed assets (Vite adds content hashes)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }

    # Relay GitHub's "latest release" API over plain HTTP. Nothing on the
    # device asks for it yet; it is here so a future on-device update check can
    # skip TLS the way camillia-mt's does. /releases/latest already excludes
    # prereleases. Exact match wins over the regex firmware proxy below.
    location = /firmware/latest {
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "platy-aprs-proxy";
        proxy_ssl_server_name on;
        proxy_pass https://api.github.com/repos/oumike/platy-aprs/releases/latest;

        proxy_http_version 1.1;
        proxy_buffering off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Firmware proxy: GitHub release CDN doesn't send CORS headers, so we
    # fetch server-side and re-emit with permissive CORS so esp-web-tools
    # can download the .bin via fetch() from the browser.
    location ~ ^/firmware/(?<release_path>.+)$ {
        proxy_set_header Host github.com;
        proxy_ssl_server_name on;
        proxy_pass https://github.com/oumike/platy-aprs/releases/download/$release_path;

        proxy_intercept_errors on;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;

        # Follow GitHub's 302 to release-assets.githubusercontent.com via a
        # named location so the redirect doesn't reach the browser.
        proxy_pass_request_headers on;
        error_page 301 302 = @firmware_redirect;

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @firmware_redirect {
        set $redirect_url $upstream_http_location;
        proxy_set_header Host release-assets.githubusercontent.com;
        proxy_ssl_server_name on;
        proxy_pass $redirect_url;

        proxy_buffering off;
        proxy_http_version 1.1;

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback: any non-file route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
